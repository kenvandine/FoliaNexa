name: folia-nexa-db
adopt-info: db
summary: Self-contained shared MySQL/MariaDB instance for a FoliaNexa cluster
description: |
  Bundles MariaDB itself so the cluster's shared database — LuckPerms
  today (PLAN.md §11B), potentially other MySQL-backed plugins later —
  doesn't need a hand-provisioned container. Install this snap, start
  it, and you have a running, network-reachable MariaDB instance with a
  dedicated database/user bootstrapped on first start.

  Deliberately its own snap, not bundled into folia-nexa-mgmt: worlds
  connect to this database directly (LuckPerms plugin -> MySQL wire
  protocol, not through mgmt's API — see PLAN.md §11B), so its lifecycle
  needs to stay independent of mgmt's. A `snap refresh folia-nexa-mgmt`
  should never interrupt every running world's active DB connection.
base: core24
confinement: strict
grade: stable

environment:
  FOLIA_DB_NAME: luckperms
  FOLIA_DB_USER: luckperms
  FOLIA_DB_PORT: '3306'

apps:
  daemon:
    command: bin/run-folia-nexa-db.sh
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    plugs: [network, network-bind]

  show-credentials:
    command: bin/show-credentials.sh

  mysql:
    command: usr/bin/mysql
    plugs: [network]

parts:
  db:
    plugin: nil
    source: .
    stage-packages:
      - mariadb-server
      - mariadb-client
    # adopt-info above sources this part's version from .build-commit —
    # see mgmt/snapcraft.yaml's identical comment for why this reads a
    # file written by tools/build-snap.sh rather than the repo's real
    # .git directly (confirmed for real: not reachable from inside the
    # LXD/multipass build instance, no matter how it's pulled). Base
    # "11.8" is the bundled MariaDB major.minor (stage-packages below),
    # kept as a prefix so that's still visible alongside which commit of
    # this repo's own db/ scripts produced the build.
    override-build: |
      craftctl default
      if [ -f .build-commit ]; then
        craftctl set version="11.8+git$(cat .build-commit)"
      else
        craftctl set version="11.8"
      fi
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp bin/run-folia-nexa-db.sh $CRAFT_PART_INSTALL/bin/run-folia-nexa-db.sh
      cp bin/show-credentials.sh $CRAFT_PART_INSTALL/bin/show-credentials.sh
      chmod +x $CRAFT_PART_INSTALL/bin/run-folia-nexa-db.sh $CRAFT_PART_INSTALL/bin/show-credentials.sh
