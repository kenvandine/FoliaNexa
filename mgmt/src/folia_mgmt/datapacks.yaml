# Curated data pack catalog. See datapack_catalog.py's module docstring
# for how this is loaded/merged with operator overrides — same pattern as
# catalog.yaml's plugins, just a separate list since data packs stage into
# a world's `<level-name>/datapacks/` folder, not `plugins/`.
#
# `id` is what world.datapacks entries reference (the `--datapack` CLI
# flag) — treat it as a stable key, not just a display label.

- id: Matcha
  category: gameplay-tweaks
  source: external
  version: "1.12"
  download_url: "https://cdn.modrinth.com/data/QI0EmgZ1/versions/E9rngRfK/Matcha_Flavoured_1_12.zip"
  sha256: "6209783021c358044abedabacee471faff5bd4080437d4e3b5e51963f1804248"
  homepage: "https://modrinth.com/datapack/matcha-flavoured"
  verified: true
  notes: >
    "Matcha Flavoured" by klei_wright — reworks vanilla gameplay to be
    friendlier to slower/less-technical players (recipe tweaks, tool
    changes, etc). Verified 2026-08-15: downloaded the exact download_url
    above from Modrinth's API and confirmed the sha256 for real (Modrinth
    itself only publishes sha1/sha512 for this file, not sha256 — computed
    here directly from the downloaded bytes). The zip's root pack.mcmeta
    declares `min_format: 88.0, max_format: 107.1` (Modrinth lists it as
    built for game version "26.2") — check that range against whatever
    Minecraft version a world runs before declaring this, the same way
    catalog.yaml's minigame-plugin entries call out to check Folia
    compatibility rather than mgmt enforcing it. Also bundles some
    `assets/` (custom sounds) alongside its `data/` folder — normal for
    this pack, both land together under datapacks/ since it's a single
    zip.

- id: Terralith
  category: worldgen
  source: external
  version: "2.6.4"
  download_url: "https://cdn.modrinth.com/data/8oi3bsk5/versions/CzijfXJQ/Terralith_26.2_v2.6.4.zip"
  sha256: "5ac86ed13cc9fc617cbb57e14ce02b1ecac2f2776c36f0536a519378e546e23e"
  homepage: "https://modrinth.com/datapack/terralith"
  verified: true
  notes: >
    Verified 2026-08-18 — downloaded from Modrinth's CDN and sha256'd
    directly (Modrinth only publishes sha1/sha512 for this file). Adds
    ~85 new overworld biomes and reworked terrain generation, no mod
    loader required — pure vanilla data pack. pack.mcmeta declares
    min_format/max_format both 107 (Modrinth lists it as built for game
    version "26.2"), same check-before-use caveat as Matcha above.
    Overworld worldgen data packs only affect chunks generated after
    they're active — same `<level-name>/datapacks/` staging and
    first-boot/world-generation timing constraint as every entry in this
    catalog (see the `LEVEL_NAME` note in node/src/folia_node/staging.py
    and CLAUDE.md's Phase 5), but doubly important here since retrofitting
    it onto an already-explored world leaves old terrain unchanged and
    only new chunks get Terralith's biomes. Confirmed 2026-08-20 against
    a real boot log: its `setup` function (scoreboard init + a
    schedule-function toast on first join) and `rtp_testing` (a debug
    /spreadplayers helper) both fail — `Scoreboard`, `Schedule`, and
    `SpreadPlayers` are all on PaperMC's own documented list of commands
    Folia disables outright, for any caller including a data pack
    function, not something any datapack build can route around. Both
    are minor bonus features, not the pack's actual worldgen content
    (biomes/terrain are pure data-driven registry entries, never touch
    the disabled-command system at all) — the pack's real value is
    intact, this is cosmetic.

- id: Incendium
  category: worldgen
  source: external
  version: "5.5.0"
  download_url: "https://cdn.modrinth.com/data/ZVzW5oNS/versions/znNBZB6M/Incendium_Legacy_26.2_v5.5.0.zip"
  sha256: "5fbce5019dac4a9dcd31b561e0b8f924aaa87557f75f7ed75e35cfaa27f3b2cc"
  homepage: "https://modrinth.com/datapack/incendium"
  verified: true
  notes: >
    Verified 2026-08-18 — downloaded from Modrinth's CDN and sha256'd
    directly. Nether-biome counterpart to Terralith above, from the same
    Stardust Labs team. This is the "Incendium Legacy" project
    specifically — the same Modrinth listing also ships a separate
    Fabric/Forge/NeoForge/Quilt mod build under the same version number
    for modded installs; this entry deliberately pins the vanilla
    data-pack zip, not that jar. pack.mcmeta declares min_format/
    max_format both [107, 1] (Modrinth lists it as built for game version
    "26.2") — check against the target world's version. Same
    generate-only-in-new-chunks caveat as Terralith; install before first
    world generation for full effect, and note Modrinth's own filename
    for several recent builds carries an "_UNSUPPORTED" suffix on older
    game-version builds (not this one) — a signal from the author that
    those specific builds aren't actively supported, worth checking
    before pinning an older version than this entry. Confirmed
    2026-08-20 against a real boot log: this build (the only real,
    current, correctly-targeted 26.2 datapack release — checked every
    other available version on Modrinth, all older ones carry the
    "_UNSUPPORTED" filename suffix mentioned above) still throws ~2,230
    "Failed to load function incendium:border_of_life/tree/*" errors —
    every single one an `execute ... run function ...` call, and
    `Function` is on PaperMC's own documented list of commands Folia
    disables outright for any caller, data pack functions included, not
    fixable by any datapack build. This is one entire decorative
    subsystem (an ambient "note block song" system in one Nether biome)
    breaking, not the pack's core terrain/biome generation — that's
    pure worldgen registry data and never touches the disabled-command
    system. Real, if noisy: expect ~2,230 ERROR lines on every boot from
    this alone. No fix available short of Stardust Labs rewriting that
    one subsystem to not depend on the /function command.

- id: Nullscape
  category: worldgen
  source: external
  version: "1.2.20"
  download_url: "https://cdn.modrinth.com/data/LPjGiSO4/versions/prWWpjSv/Nullscape_26.2_v1.2.20.zip"
  sha256: "ec7b0dfcd1add8c127c985dac1466a44168449b3b6641dd20e6b2e16153b66aa"
  homepage: "https://modrinth.com/datapack/nullscape"
  verified: true
  notes: >
    Verified 2026-08-18 — downloaded from Modrinth's CDN and sha256'd
    directly. End-dimension counterpart to Terralith/Incendium above,
    same Stardust Labs team, pure vanilla data pack (loaders: datapack
    only, no separate mod build unlike Incendium). pack.mcmeta declares
    min_format/max_format both [107, 1] (Modrinth lists it as built for
    game version "26.2"). Same generate-only-in-new-chunks caveat as the
    other two Stardust Labs packs above — install before a world first
    generates its End dimension for full effect. Confirmed 2026-08-20
    against a real boot log: `setup` (scoreboard init + schedule-
    function), `tick`, `wait_for_player`, and `link_rift` (all
    `run function`/`schedule function`) fail — same root cause as
    Incendium/Terralith above, `Scoreboard`/`Schedule`/`Function` are
    all on PaperMC's documented Folia-disabled-commands list, not
    fixable by picking a different build. This breaks the rift-linking
    mechanic specifically; End terrain/structure generation is separate
    data-driven worldgen content and should be unaffected.

# The dozen entries below were requested by name from Vanilla Tweaks
# (vanillatweaks.net) — Double Shulker Shells, Player Head Drops,
# Wandering Trades, Anti-Creeper Grief, Anti-Enderman Grief, Armor
# Statues, Cauldron Concrete, Silence Mobs, Unlock All Recipes, AFK
# Display, Universal Dyeing, Unpackable Items. Confirmed 2026-08-18: none
# of these can resolve to a real download_url the way this catalog
# expects. Vanilla Tweaks doesn't publish static per-pack file URLs at
# all — every download on the site (single pack or multi-pack bundle) is
# generated on demand by POSTing a JSON selection to their zip-builder
# API, which returns a fresh, non-deterministic zip each time rather than
# serving a stable file from a fixed path (confirmed by probing several
# guessed static-asset paths under vanillatweaks.net — all 404, unlike
# Modrinth/Hangar/GitHub Releases/SpigotMC's file-hosting patterns this
# catalog's other entries rely on). These are also not mirrored on
# Modrinth, Hangar, or GitHub Releases under their Vanilla Tweaks names
# specifically. This is the same shape as HuskClaims/AxAuctions/ItemsAdder
# above (source is real, plugin.yml-equivalent details are real, but a
# plain public download_url this catalog can pin doesn't exist) — an
# operator who wants these should build the exact multi-pack zip
# themselves at vanillatweaks.net (picking their world's Minecraft
# version) and host it via a plugin-catalog-override.yaml entry (or,
# since Vanilla Tweaks bundles are usually installed as one combined zip
# rather than one-pack-per-id, host the whole bundle under a single
# override id and skip these dozen placeholders' individual `--datapack`
# flags entirely).

