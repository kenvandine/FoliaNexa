    luckperms.py), mgmt does not yet template/push HuskHomes' own
    config.yml with the shared MySQL credentials, so on every world it
    currently runs standalone (SQLite-per-world, no cross-server /tpa)
    until that sync is built — tracked as a follow-up, same shape as
    sync_luckperms_configs.

