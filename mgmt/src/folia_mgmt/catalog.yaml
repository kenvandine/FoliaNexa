- id: WorldGuard
  category: protection
  source: external
  version: "7.0.13"
  download_url: "https://cdn.modrinth.com/data/DKY9btbd/versions/f9NoeotB/worldguard-bukkit-7.0.13-dist.jar"
  sha256: "73b43a46aefc76514b90994532ea18bfd6d92e7bc5dcabbef9049a71778b21b5"
  homepage: "https://modrinth.com/plugin/worldguard"
  verified: true
  notes: >
    Verified 2026-08-18 — downloaded from Modrinth's CDN and sha256'd for
    real, but flag this one before relying on it: Modrinth's published
    builds for this version only declare bukkit/paper/spigot loaders, not
    folia. WorldGuard's region-protection model predates Folia's
    regionized multithreading and does state mutation (region cache,
    flag application) that classic Bukkit plugins generally assume
    happens on one single-threaded world tick — the same class of
    caveat already noted on SkyWarsReloaded/BedWars1058 in this file.
    The jar will load, but its Folia-safety isn't verified; test region
    protection carefully under real concurrent load before trusting it
    in production. Hard-depends on WorldEdit (entry above) being
    installed on the same world.

