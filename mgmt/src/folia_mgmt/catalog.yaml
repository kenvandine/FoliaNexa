# Curated plugin catalog. PLAN.md §14 — see plugin_catalog.py's module
# docstring for how this is loaded/merged with operator overrides.
#
# `id` is what world.plugins entries reference (matches the `--plugin`
# values already used in configs/worlds/*.sh) — treat it as a stable key,
# not just a display label.
#
# `verified: true` entries were fetched and sha256'd for real during
# development (dates noted below); `verified: false` entries are
# placeholders using download_url: null — they need a real URL resolved
# before a world that declares them can actually stage its plugins.

