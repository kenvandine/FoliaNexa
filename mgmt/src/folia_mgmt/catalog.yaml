- id: HuskHomes
  category: navigation
  source: external
  version: "4.11"
  download_url: "https://cdn.modrinth.com/data/J6U9o3JG/versions/MznzQDLE/HuskHomes-Paper-4.11.jar"
  sha256: "4040f6b653f5fae0f030ecd98e93c3b7db34ddf361da9a5d2141e483c3eabaa3"
