- id: CampusLobby
  category: lobby
  source: in-house
  version: "0.1.0"
  download_url: "https://github.com/kenvandine/folianexa-plugins/releases/download/campus-lobby-v0.0.2/campus-lobby-0.1.0.jar"
  sha256: "f7784c0004e6cb859a6d59b1c4a9b532ccc8b0ac45421b2f54afc1df42d0bca0"
  homepage: "https://github.com/kenvandine/folianexa-plugins/tree/main/campus-lobby"
  verified: true
  notes: >
    Procedurally builds an NC State Wolfpack-themed scene (Brickyard
    plaza, Memorial Belltower, wolf-mascot statue, Free Expression
    Tunnel-style mural, student-union/library facades) into a lobby
    world. Source lives in the sibling folianexa-plugins repo (campus-
    lobby/), not this one — see the "In-house plugin source" note in this
    repo's CLAUDE.md. Release campus-lobby-v0.0.1 (2026-08-15) loaded on a
