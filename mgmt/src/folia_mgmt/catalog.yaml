- id: DiscordSRV
  category: chat-bridge
  source: external
  version: "1.30.5"
  download_url: "https://cdn.modrinth.com/data/UmLGoGij/versions/ATlquwiT/DiscordSRV-Build-1.30.5.jar"
  sha256: "ef2fa1f2eb146c7c77412b7190a7dd33f1fc91282683fe45407739554c8aefef"
  homepage: "https://github.com/DiscordSRV/DiscordSRV"
  verified: true
  notes: >
    Verified 2026-08-16 — downloaded from Modrinth's CDN and sha256'd
    directly. Two-way Discord<->in-game chat bridge, role sync, join/
    leave/death event relay, admin commands from Discord. Folia support
    landed in 1.27.0; this build (1.30.5) tags the "folia" loader
    explicitly on Modrinth. Runs per-world (it's a Paper plugin, not a
    Velocity one) — install it on one hub/social world rather than
    every world, or multiple instances will each try to relay the same
    Discord channel. Needs its own bot token (a separate Discord
    application from folia-nexa-bot's, configured in its own
    config.yml — mgmt doesn't template or manage this plugin's config
    the way it does LuckPerms').

- id: Floodgate
  category: bedrock-bridge
  source: external
  version: "2.2.5"
  download_url: "https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/140/downloads/spigot"
  sha256: "9f436c42ffd8b1091a437d7a4e16f82181b9d5314f8b1732dfa9d5a4fffb19fe"
  homepage: "https://geysermc.org/floodgate"
  verified: true
  notes: >
    Verified 2026-08-15 — downloaded from GeyserMC's build API and
    sha256'd for real. Optional, Paper-side counterpart to the
    Geyser-Velocity + floodgate-velocity plugins bundled into the
    folia-nexa-proxy snap itself (PLAN.md §7B) — the proxy alone is
    enough for Bedrock players to join at all; add this to a world's
    `--plugin` list only if that world should recognize Bedrock players
    specifically (correct skin/identity there, the Floodgate API for
    other plugins). Requires a one-time manual step: after
    folia-nexa-proxy has started once (so its bundled Floodgate has
    generated a keypair), copy
    $SNAP_COMMON/proxy/plugins/floodgate/key.pem from the proxy host to
    this world's plugins/floodgate/key.pem and restart the world — there
    is no automated proxy-to-world file-push channel for this today
    (unlike LuckPerms' mgmt-driven config sync, see luckperms.py).
    Without a matching key.pem the world can't decrypt the identity data
    Floodgate forwards through the proxy. This is a rolling per-minor-
    version build URL (2.2.5 build 140 at verification time) — re-check
    before assuming it stays current indefinitely.

