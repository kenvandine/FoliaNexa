- id: FoliaNexaStats
  category: analytics
  source: in-house
  version: "0.0.4"
  download_url: "https://github.com/kenvandine/folianexa-plugins/releases/download/folianexa-stats-v0.0.4/folianexa-stats-0.0.4.jar"
  sha256: "29e7bacb3a80125489f7dab8a8aa93f0a59432c984f569065d5e067abd3e90ad"
  homepage: "https://github.com/kenvandine/folianexa-plugins/tree/main/folianexa-stats"
  verified: true
  default_for_all_worlds: true
  notes: >
    Feeds the public player hub (portal/, PLAN.md §7A) — reports
    kills/deaths/blocks-mined/playtime to POST /api/v1/stats/report
    periodically via Bukkit's AsyncScheduler, and softdepends on
    AuraSkills/Vault (economy balance, gated on AxAuctions being present)
    to additionally report power level/wealth when either is present on
    the same world. Source: kenvandine/folianexa-plugins, folianexa-stats/
    — see docs/plugin-dev/03-submitting-for-review.md §3.1 for why it
    lives in its own repository rather than here. v0.0.1/v0.0.2 loaded
    fine on old-versioned Paper but failed outright on a real Folia 26.2
    world: "Could not load plugin 'FoliaNexaStats v0.1.0' as it is not
    marked as supporting Folia!" — the code already used
    AsyncScheduler/RegionScheduler throughout, just missing
    folia-supported: true in plugin.yml (same bug CampusLobby had).
    Fixed and re-released as v0.0.3 (2026-08-16). Once that loaded for
    real (on a world whose mgmt-api-token was also finally populated —
    see this session's folianexa_stats.py), its reports still failed:
    HttpMgmtClient's java.net.http.HttpClient defaults to attempting an
    HTTP/2 "Upgrade: h2c" handshake even over plain http://, which
    corrupted request framing against mgmt's uvicorn/h11 server —
    intermittent "422 Field required, input: null" alternating with a
    bare "400 Invalid HTTP request received," never a clean failure.
    Fixed by pinning HTTP_1_1 explicitly, re-released as v0.0.4
    (2026-08-16, same day). download_url/sha256 above downloaded
    directly and verified for real; a real report from a live Folia
    26.2 world reaching mgmt with a 200 (not 422/400) is what's
    actually being confirmed right now, this being the fix for it.

