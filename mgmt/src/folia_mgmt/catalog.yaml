  verified: true
  default_for_all_worlds: true
  notes: >
    Verified 2026-08-16 — downloaded from Modrinth's CDN and sha256'd
    directly (Modrinth's API only publishes sha1/sha512 for this file,
    same caveat as the Matcha data pack entry). /home, /warp, /tpa
    across the whole Velocity network — needs a MySQL backend to work
    cross-server; reuses the same LuckPerms MySQL instance (Phase 6,
    configs/luckperms/provision-mysql.sh or folia-nexa-db) rather than
