    'CampusLobby v0.1.0' as it is not marked as supporting Folia!" — the
    code already used RegionScheduler/GlobalRegionScheduler throughout
    (verified by reading SceneBuilder/CampusLobbyListener), just missing
    `folia-supported: true` in plugin.yml. Fixed and re-released as
    campus-lobby-v0.0.2 (2026-08-16, same day) — this entry's
    download_url/sha256 point at that release; downloaded directly and
    confirmed sha256 matches GitHub's own reported asset digest, and
    confirmed the jar now has folia-supported: true. Verified live on a
    real Folia 1.21.4 world (see the `lobby` world declared during
    cluster onboarding): loads without error, though the scene actually
    rendering correctly in-game (not just loading) hasn't been checked
    with a real client.

