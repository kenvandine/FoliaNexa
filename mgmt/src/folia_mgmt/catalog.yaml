    folia-supported: true directly (confirmed by inspecting the jar, not
    just Modrinth's loader tag) and lists Vault as a softdepend — it
    registers as a Vault/Vault-Unlocked economy provider the same way
    EssentialsX does, so it satisfies a ChestShop/Vault-Unlocked world's
    need for an actual economy backend. plugin.yml also declares a
    `/migration` command ("Migrate EssX data to EssC") — not run or
    verified here, but worth using over a manual re-balance if swapping
    onto a world with existing EssentialsX player data.

