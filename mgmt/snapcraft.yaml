name: folia-nexa-mgmt
version: '0.1'
summary: Folia cluster orchestrator — scheduler, REST API, and dashboard
description: |
  Trusts LXD hosts directly over the remote API and schedules Folia/Paper
  worlds (overworld, nether, lobby, minigames, ...) across them. See
  PLAN.md in the FoliaNexa repo for the full design.
base: core24
confinement: strict
grade: stable

# $SNAP_COMMON/mgmt holds the SQLite DB and mgmt's own LXD client cert/key
# (PLAN.md §3, §8A) — persists across revisions, never touches $SNAP.
environment:
  FOLIA_MGMT_STATE_DIR: $SNAP_COMMON/mgmt

apps:
  folia-nexa-mgmt:
    command: bin/folia-nexa-mgmt
    plugs: [network]

  daemon:
    command: bin/run-mgmt-daemon.sh
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    plugs: [network, network-bind]

# `snap set folia-nexa-mgmt listen-port=<port>` overrides Settings.listen_port
# (default 8443) without a hand-rolled systemd drop-in — useful when this
# snap and a host's own LXD remote API (also default 8443) share a machine.
# `snap set folia-nexa-mgmt public-url=<url>` overrides Settings.public_url
# (unset by default — required before any world can declare plugins/
# datapacks, see routers/worlds.py) the same way.
# `snap set folia-nexa-mgmt artifacts-base-url=<url>` overrides
# Settings.artifacts_base_url (default the unreachable placeholder
# https://artifacts.internal — every world's engine-jar download fails
# with a DNS error until this is set to a real host, see config.py's own
# comment) the same way.
# scripts/run-mgmt-daemon.sh reads all three via snapctl at every daemon
# start; snap/hooks/configure restarts the daemon whenever any is changed.
parts:
  mgmt:
    plugin: python
    source: .
    python-packages: []
    stage-packages:
      - libargon2-1
    override-build: |
      craftctl default
      install -m 0755 scripts/run-mgmt-daemon.sh "$CRAFT_PART_INSTALL/bin/run-mgmt-daemon.sh"
