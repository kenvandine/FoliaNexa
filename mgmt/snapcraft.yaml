name: folia-smp-mgmt
version: '0.1'
summary: Folia cluster orchestrator — scheduler, REST API, and dashboard
description: |
  Trusts LXD hosts directly over the remote API and schedules Folia/Paper
  worlds (overworld, nether, lobby, minigames, ...) across them. See
  PLAN.md in the folia-server repo for the full design.
base: core24
confinement: strict
grade: stable

# $SNAP_COMMON/mgmt holds the SQLite DB and mgmt's own LXD client cert/key
# (PLAN.md §3, §8A) — persists across revisions, never touches $SNAP.
environment:
  FOLIA_MGMT_STATE_DIR: $SNAP_COMMON/mgmt

apps:
  folia-smp-mgmt:
    command: bin/folia-smp-mgmt
    plugs: [network]

  daemon:
    command: bin/folia-smp-mgmt serve
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    plugs: [network, network-bind]

parts:
  mgmt:
    plugin: python
    source: .
    python-packages: []
    stage-packages:
      - libargon2-1
