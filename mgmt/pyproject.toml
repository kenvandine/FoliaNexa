[project]
name = "folia-nexa-mgmt"
version = "0.1.0"
description = "Folia cluster orchestrator: scheduler, REST API, and dashboard (see PLAN.md)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "typer>=0.12",
  "pydantic-settings>=2.4",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
folia-nexa-mgmt = "folia_mgmt.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folia_mgmt = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
