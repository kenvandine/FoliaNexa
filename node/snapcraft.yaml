name: folia-smp-node
version: '0.1'
summary: In-container Folia/Paper world runner and health agent
description: |
  Reads its world assignment off the container's own devlxd socket (no
  network call to mgmt needed just to find out what to run), stages the
  jar/plugins, runs the JVM, and serves local health/metrics for
  folia-smp-mgmt to scrape. See PLAN.md §9.
base: core24
confinement: strict
grade: stable

environment:
  WORLD_DIR: $SNAP_COMMON/world
  JAVA_BIN: $SNAP/usr/lib/jvm/java-21-openjdk-amd64/bin/java
  JAVA_HOME: $SNAP/usr/lib/jvm/java-21-openjdk-amd64
  DEVLXD_SOCKET: /dev/lxd/sock
  FOLIA_NODE_HEALTH_PORT: '8123'

apps:
  daemon:
    command: bin/folia-smp-node
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    plugs: [network, network-bind]
    # /dev/lxd/sock is bind-mounted into every LXD container by the LXD
    # daemon itself (not something this snap opts into) and recent snapd
    # allows strictly-confined snaps to use it without a dedicated
    # interface. NOT validated against a live built snap in this
    # environment — if AppArmor denies the socket open, confinement will
    # need `devmode` during bring-up or a bug filed against snapd's policy
    # for this path.

parts:
  node:
    plugin: python
    source: .
    stage-packages:
      - openjdk-21-jre-headless
