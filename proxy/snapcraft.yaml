name: folia-nexa-proxy
version: '3.5.1'
summary: Velocity proxy with live routing synced from folia-nexa-mgmt
description: |
  Velocity Next-Gen proxy, packaged with the folia-routes-sync plugin
  (this directory's Gradle project) that keeps the backend server list in
  sync with folia-nexa-mgmt's GET /api/v1/routes — worlds can come and go
  without a proxy restart. See PLAN.md §7, §8C. Also bundles Geyser-
  Velocity + floodgate-velocity so Bedrock (console/mobile/Win10) clients
  can join through the same proxy — see PLAN.md §7B.
base: core24
confinement: strict
grade: stable

environment:
  JAVA_HOME: $SNAP/usr/lib/jvm/java-21-openjdk-amd64
  PATH: $SNAP/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH

apps:
  daemon:
    command: bin/run-velocity.sh
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    plugs: [network, network-bind]

parts:
  # Builds folia-routes-sync-<version>.jar via the real Gradle wrapper in
  # this directory (verified locally with `./gradlew build` — 15/15 tests
  # pass, jar contains the annotation-processor-generated
  # velocity-plugin.json). snapcraft's `gradle` plugin invokes ./gradlew
  # itself; its output lands under $CRAFT_PART_INSTALL/plugins and is
  # merged into the final snap tree automatically, no explicit copy step
  # needed between parts.
  routes-sync-plugin:
    plugin: gradle
    source: .
    gradle-task: shadowJar
    build-packages:
      - openjdk-21-jdk-headless
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/plugins
      cp build/libs/folia-routes-sync-*.jar $CRAFT_PART_INSTALL/plugins/

  velocity-runtime:
    plugin: nil
    stage-packages:
      - openjdk-21-jre-headless
    override-build: |
      set -e
      # Resolve the latest PaperMC ("Fill" — api.papermc.io/v2 was sunset;
      # this is its documented replacement, confirmed live) build for this
      # Velocity version at build time rather than pinning a build number
      # that goes stale.
      DOWNLOAD_URL=$(curl -sf "https://fill.papermc.io/v3/projects/velocity/versions/${CRAFT_PROJECT_VERSION}/builds" \
        | python3 -c "import json,sys; print(json.load(sys.stdin)[-1]['downloads']['server:default']['url'])")
      curl -sf -o $CRAFT_PART_INSTALL/velocity.jar "$DOWNLOAD_URL"

      mkdir -p $CRAFT_PART_INSTALL/bin
      cat << 'EOF' > $CRAFT_PART_INSTALL/bin/run-velocity.sh
      #!/bin/bash
      set -euo pipefail
      PROXY_DIR="$SNAP_COMMON/proxy"
      mkdir -p "$PROXY_DIR/plugins"
      cd "$PROXY_DIR"

      # First run: seed the working directory from the snap's read-only
      # payload ($SNAP/plugins/*.jar — folia-routes-sync plus the bundled
      # Geyser-Velocity/floodgate-velocity jars from the geyser-plugins
      # part below). Never overwrite an operator-edited velocity.toml/
      # plugin set on subsequent runs — this also means an operator who
      # doesn't want Bedrock support can just delete those two jars from
      # $PROXY_DIR/plugins/ once, post-install, and it'll stick.
      [ -f velocity.jar ] || cp "$SNAP/velocity.jar" velocity.jar
      for jar in "$SNAP"/plugins/*.jar; do
        [ -f "plugins/$(basename "$jar")" ] || cp "$jar" "plugins/"
      done

      # FOLIA_MGMT_URL / FOLIA_MGMT_API_TOKEN / FOLIA_ROUTES_POLL_SECONDS /
      # FOLIA_ACCESS_GATE_ENABLED —
      # see folia-routes-sync's FoliaRoutesSyncPlugin javadoc. Operator-
      # provided, not shipped with the snap.
      [ -f config.env ] && source config.env

      exec java -Xms1G -Xmx2G -XX:+UseG1GC -jar velocity.jar
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/run-velocity.sh

  # Geyser-Velocity (Bedrock<->Java protocol translation) + floodgate-
  # velocity (lets unlinked/non-premium Bedrock/Xbox accounts join) —
  # both run as ordinary Velocity plugins, so bundling their jars here is
  # all that's needed; run-velocity.sh's existing seed loop above (in
  # velocity-runtime) picks up anything dropped into
  # $CRAFT_PART_INSTALL/plugins across every part, including this one, no
  # further wiring required. PLAN.md §7B.
  #
  # Deliberately pinned to "latest" rather than a fixed build number, the
  # opposite choice from velocity-runtime's pinned Velocity version:
  # Velocity itself is pinned for backend-protocol stability, but Geyser
  # tracks newly-released Bedrock client versions continuously and an
  # old, pinned Geyser build breaks newer Bedrock clients outright.
  geyser-plugins:
    plugin: nil
    override-build: |
      set -e
      mkdir -p $CRAFT_PART_INSTALL/plugins
      curl -sf -o $CRAFT_PART_INSTALL/plugins/Geyser-Velocity.jar \
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/velocity
      curl -sf -o $CRAFT_PART_INSTALL/plugins/floodgate-velocity.jar \
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/velocity
